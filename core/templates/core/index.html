<!DOCTYPE html>
<html>
<head>
    <title>MyTax - Letter Generator</title>

    <style>
        body {
            font-family: Arial;
            max-width: 700px;
            margin: auto;
            padding: 20px;
            background: #f5f7fa;
        }

        h2 {
            text-align: center;
        }

        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #0a3d62;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #3c6382;
        }

        .step {
            display: none;
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .active {
            display: block;
        }

        /* STATUS MESSAGE */
        .message {
            display: none;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .success {
            background: #e6ffe6;
            color: #006600;
        }

        .error {
            background: #ffe6e6;
            color: #b30000;
        }

        /* LOADING OVERLAY */
        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }

        .spinner {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #2c7be5;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

<h2>MyTax - Generate Letter</h2>

<!-- MESSAGE BOX -->
<div id="messageBox" class="message"></div>

<form id="form" method="POST" action="/api/generate-letter/" enctype="multipart/form-data">

    {% csrf_token %}

    <!-- STEP 1 -->
    <div id="step1" class="step active">
        <h3>Step 1: Basic Info</h3>

        <input type="text" name="tin" placeholder="TIN" maxlength="9" required>
        <input type="email" name="email" placeholder="Email" required>

        <button type="button" onclick="nextStep(2)">Next</button>
    </div>

    <!-- STEP 2 -->
    <div id="step2" class="step">
        <h3>Step 2: Details</h3>

        <input type="text" name="name" placeholder="Full Name" required>
        <input type="text" name="phone" placeholder="Phone" required>

        <select name="language">
            <option value="en">English</option>
            <option value="rw">Kinyarwanda</option>
        </select>

        <input type="number" name="months" placeholder="Months (2-12)" min="2" max="12" required>
        <input type="number" name="initial_payment" placeholder="Initial payment (50,000 - 5,000,000)" min="50000" max="5000000" required>

        <button type="button" onclick="nextStep(3)">Next</button>
    </div>

    <!-- STEP 3 -->
    <div id="step3" class="step">
        <h3>Step 3: Signature</h3>

        <input type="file" name="signature" accept="image/png, image/jpeg" required>

        <button type="submit">Generate Letter</button>
    </div>
</form>

<!-- LOADING -->
<div id="overlay" class="overlay">
    <div class="spinner"></div>
    <p>Generating your letter...</p>
</div>

<script>
let currentStep = 1;

function showMessage(type, text) {
    const box = document.getElementById("messageBox");
    box.style.display = "block";
    box.className = "message " + type;
    box.innerText = text;
}

function nextStep(step) {

    const tin = document.querySelector('input[name="tin"]').value.trim();
    const email = document.querySelector('input[name="email"]').value.trim();

    if (step === 2) {
        if (!/^1\d{8}$/.test(tin)) {
            showMessage("error", "TIN must start with 1 and be 9 digits");
            return;
        }

        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            showMessage("error", "Invalid email address");
            return;
        }
    }

    if (step === 3) {
        const name = document.querySelector('input[name="name"]').value.trim();
        const months = document.querySelector('input[name="months"]').value;
        const payment = document.querySelector('input[name="initial_payment"]').value;

        if (!name || name.length < 2) {
            showMessage("error", "Invalid name");
            return;
        }

        if (months < 2 || months > 12) {
            showMessage("error", "Months must be between 2 and 12");
            return;
        }

        if (payment < 50000 || payment > 5000000) {
            showMessage("error", "Payment must be between 50,000 and 5,000,000");
            return;
        }
    }

    document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
    document.getElementById("step" + step).classList.add("active");

    currentStep = step;
}

document.getElementById("form").addEventListener("submit", async function(e) {
    e.preventDefault();

    const overlay = document.getElementById("overlay");
    const formData = new FormData(this);

    overlay.style.display = "flex";

    try {
        const response = await fetch("/api/generate-letter/", {
            method: "POST",
            body: formData
        });

        if (!response.ok) {
            const err = await response.json();
            overlay.style.display = "none";
            showMessage("error", err.error || "Something went wrong");
            return;
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "letter.pdf";
        document.body.appendChild(a);
        a.click();
        a.remove();

        overlay.style.display = "none";
        showMessage("success", "Letter generated successfully!");

    } catch (err) {
        overlay.style.display = "none";
        showMessage("error", "Network error. Please try again.");
    }
});
</script>

</body>
</html>
